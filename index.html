<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Synth Sess - PlayHTML Chaos Board</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  </head>
  <body>

    <div class="synth-workspace" id="board">
      
      <!-- DRUMS -->
      <div class="module pedal-box" id="drum-pedal" style="background-image: url('images/bb-bg.jpg');">
        <div class="buttons-row">
          <button type="button" class="photo-btn" can-mirror can-hover id="ht-btn" onclick="handleDrumButton('sounds/808ht_HT00.WAV', event)"><img src='images/red-push-button.png'></button>
          <button type="button" class="photo-btn" can-mirror can-hover id="cy-btn" onclick="handleDrumButton('sounds/808cy_CY0000.WAV', event)"><img src='images/red-push-button.png'></button>
        </div>
        <div class="buttons-row">
          <button type="button" class="photo-btn" can-mirror can-hover id="sd-btn" onclick="handleDrumButton('sounds/808sd_SD0000.WAV', event)"><img src='images/red-push-button.png'></button>
        </div>
        <div class="buttons-row">
          <button type="button" class="photo-btn" can-mirror can-hover id="mt-btn" onclick="handleDrumButton('sounds/808mt_MT00.WAV', event)"><img src='images/red-push-button.png'></button>
          <button type="button" class="photo-btn" can-mirror can-hover id="hc-btn" onclick="handleDrumButton('sounds/808hc_HC00.WAV', event)"><img src='images/red-push-button.png'></button>
        </div>
      </div>

      <!-- PIANO PEDAL -->
      <div class="module pedal-box" id="piano-pedal" style="background-image: url('images/metal-sheet.jpeg');">
          <div class="octave-chooser">
            <button class="photo-btn" can-mirror can-hover id="oct-down" onclick="changeOctave(-1, event)"><img src="images/green_button.png" alt="green_button"></button>
            <span id="octave-display" class="piano-hardware-text">OCT: 4</span>
            <button class="photo-btn" can-mirror can-hover id="oct-up" onclick="changeOctave(1, event)"><img src="images/green_button.png" alt="green_button"></button>
          </div>
          <div class="keyboard-container">
            <div class="key white" can-mirror can-hover id="note-C" onclick="playNote('C', event)"></div>
            <div class="key black db" can-mirror can-hover id="note-Db" onclick="playNote('Db', event)"></div>
            <div class="key white"  can-mirror can-hover id="note-D" onclick="playNote('D', event)"></div>
            <div class="key black eb" can-mirror can-hover id="note-Eb" onclick="playNote('Eb', event)"></div>
            <div class="key white" can-mirror can-hover id="note-E" onclick="playNote('E', event)"></div>
            <div class="key white" can-mirror can-hover id="note-F" onclick="playNote('F', event)"></div>
            <div class="key black gb" can-mirror can-hover id="note-Gb" onclick="playNote('Gb', event)"></div>
            <div class="key white" can-mirror can-hover id="note-G" onclick="playNote('G', event)"></div>
            <div class="key black ab" can-mirror can-hover id="note-Ab" onclick="playNote('Ab', event)"></div>
            <div class="key white" can-mirror can-hover id="note-A" onclick="playNote('A', event)"></div>
            <div class="key black bb" can-mirror can-hover id="note-Bb" onclick="playNote('Bb', event)"></div>
            <div class="key white" can-mirror can-hover id="note-B" onclick="playNote('B', event)"></div>
        </div>
      </div>

      <!-- NOISE GENERATOR -->
      <div class="module pedal-box" id="tuner-pedal" style="background-image: url('images/noise_bg.png');">
          <h3 class="noise-pedal-title">NOISE GENERATOR</h3>
          <div class="fader-container">
            <label class="hardware-text">FREQ</label>
            <input type="range" class="physical-fader" can-play id="tuner-freq" min="100" max="5000" step="10" value="400">
          </div>
          <button class="photo-btn" style="margin-top:20px;" can-play id="tuner-toggle"><img src="images/off_toggle.png" alt="OFF"></button>
      </div>

      <!-- AUTO-BASS GRID -->
      <div class="module pedal-box" id="seq-pedal" style="background-image: url('images/minecraft.jpg'); width: 400px;">
          <h3 class="bass-grid-pedal-title">AUTO-BASS GRID</h3>
          <div class="seq-content" id="seq-grid">
            <div class="seq-track">
              <button class="tactile-btn play-btn" can-play can-hover id="play-btn-0">PLAY</button>
              <div class="seq-row">
                <input type="checkbox" class="led-step" can-play id="step-0-0"><input type="checkbox" class="led-step" can-play id="step-0-1">
                <input type="checkbox" class="led-step" can-play id="step-0-2"><input type="checkbox" class="led-step" can-play id="step-0-3">
                <input type="checkbox" class="led-step" can-play id="step-0-4"><input type="checkbox" class="led-step" can-play id="step-0-5">
                <input type="checkbox" class="led-step" can-play id="step-0-6"><input type="checkbox" class="led-step" can-play id="step-0-7">
              </div>
            </div>
            <div class="seq-track">
              <button class="tactile-btn play-btn" can-play can-hover id="play-btn-1">PLAY</button>
              <div class="seq-row">
                <input type="checkbox" class="led-step" can-play id="step-1-0"><input type="checkbox" class="led-step" can-play id="step-1-1">
                <input type="checkbox" class="led-step" can-play id="step-1-2"><input type="checkbox" class="led-step" can-play id="step-1-3">
                <input type="checkbox" class="led-step" can-play id="step-1-4"><input type="checkbox" class="led-step" can-play id="step-1-5">
                <input type="checkbox" class="led-step" can-play id="step-1-6"><input type="checkbox" class="led-step" can-play id="step-1-7">
              </div>
            </div>
            <div class="seq-track">
              <button class="tactile-btn play-btn" can-play can-hover id="play-btn-2">PLAY</button>
              <div class="seq-row">
                <input type="checkbox" class="led-step" can-play id="step-2-0"><input type="checkbox" class="led-step" can-play id="step-2-1">
                <input type="checkbox" class="led-step" can-play id="step-2-2"><input type="checkbox" class="led-step" can-play id="step-2-3">
                <input type="checkbox" class="led-step" can-play id="step-2-4"><input type="checkbox" class="led-step" can-play id="step-2-5">
                <input type="checkbox" class="led-step" can-play id="step-2-6"><input type="checkbox" class="led-step" can-play id="step-2-7">
            </div>
          </div>
        </div>
      </div>

      <!-- XY PAD -->
      <div class="module pedal-box" id="xy-pedal" style="background-image: url('images/circuit.png');">
          <div class="xy-pad" can-play id="xy-pad">
            <div class="xy-cursor" id="xy-cursor"></div>
        </div>
      </div>

      <!-- ECHO TANK -->
      <div class="module pedal-box" id="echo-pedal" style="background-image: url('images/abstraction.png');">
          <h3 class="echo-pedal-title">ECHO TANK</h3>
          <div class="fader-row">
            <div class="fader-container">
              <label class="echo-pedal-title">TIME</label>
              <input type="range" class="physical-fader" can-play id="echo-time" min="0" max="1" step="0.1" value="0.5">
            </div>
            <div class="fader-container">
              <label class="echo-pedal-title">FDBK</label>
              <input type="range" class="physical-fader" can-play id="echo-feedback" min="0" max="0.9" step="0.1" value="0.5">
            </div>
          </div>
          <button class="photo-btn" style="margin-top:20px;" can-play can-hover id="echo-toggle"><img src="images/bypass.png" alt="BYPASS"></button>
      </div>

      <!-- SHREDDER -->
      <div class="module pedal-box" id="fuzz-pedal" style="background-image: url('images/space.jpg');">
          <h3 class="shredder-pedal-title">SHREDDER</h3>
          <div class="fader-container">
            <label class="shredder-hardware-text">DSTRY</label>
            <input type="range" class="physical-fader" can-play id="fuzz-amount" min="0" max="1" step="0.1" value="0.8">
          </div>
           <button class="photo-btn" style="margin-top:20px;" can-play can-hover id="fuzz-toggle"><img src="images/clean-btn.png" alt="CLEAN"></button>
      </div>

      <!-- RIBBON GLIDE -->
      <div class="module pedal-box" id="ribbon-pedal" style="background-image: url('images/multipattern.jpg'); width: 400px;">
          <h3 class="ribbon-pedal-title">RIBBON GLIDE</h3>
          <div class="ribbon-track" can-play id="ribbon-track">
            <div class="ribbon-finger" id="ribbon-finger"></div>
        </div>
      </div>
      
    </div>

    <script type="module">
      import { playhtml } from "https://unpkg.com/playhtml@latest";

      // ==========================================
      // 1. TONE.JS ENGINE SETUP
      // ==========================================
      let toneStarted = false;
      const masterFilter = new Tone.Filter(20000, "lowpass").toDestination();

      document.body.addEventListener('click', async () => {
        if (!toneStarted) {
          await Tone.start();
          Tone.Transport.start(); 
          toneStarted = true;
        }
      }, { once: true });

      // FX Chain
      const delay = new Tone.FeedbackDelay("8n", 0.5);
      const fuzz = new Tone.Distortion(0.8);
      fuzz.connect(delay);
      delay.connect(masterFilter);
      
      const pianoSynth = new Tone.PolySynth().connect(masterFilter);
      let echoOn = false;
      let fuzzOn = false;

      function updatePianoRouting() {
        pianoSynth.disconnect();
        if (fuzzOn && echoOn) { pianoSynth.connect(fuzz); }
        else if (fuzzOn && !echoOn) { pianoSynth.connect(fuzz); delay.disconnect(); fuzz.connect(masterFilter); }
        else if (!fuzzOn && echoOn) { pianoSynth.connect(delay); delay.connect(masterFilter); }
        else { pianoSynth.connect(masterFilter); }
      }

      const noise = new Tone.Noise("pink");
      const noiseFilter = new Tone.Filter(400, "bandpass").connect(masterFilter);
      noise.connect(noiseFilter);

      // ==========================================
      // 2. MOMENTARY INSTRUMENTS (PIANO & DRUMS)
      // ==========================================
      
      window.handleDrumButton = (audioPath, e) => {
        if(e) e.stopPropagation(); 
        new Audio(audioPath).play().catch(() => console.log("Audio not found"));
      };

      let currentOctave = 4;
      window.changeOctave = (dir, e) => {
        if(e) e.stopPropagation();
        currentOctave = Math.max(1, Math.min(7, currentOctave + dir));
        document.getElementById('octave-display').innerText = `OCT: ${currentOctave}`;
      };

      window.playNote = (note, e) => {
        if(e) e.stopPropagation();
        pianoSynth.triggerAttackRelease(note + currentOctave, "8n");
        const keyElem = document.getElementById(`note-${note}`);
        if (keyElem) { keyElem.classList.add('active'); setTimeout(() => keyElem.classList.remove('active'), 150); }
      };

      // ==========================================
      // 3. CAN-PLAY STATEFUL INSTRUMENTS
      // ==========================================

      // --- FX TOGGLES & FADERS ---
      const fuzzToggle = document.getElementById("fuzz-toggle");
      fuzzToggle.defaultData = { isOn: false };
      fuzzToggle.onClick = (e, { data, setData }) => setData({ isOn: !data.isOn });
      fuzzToggle.updateElement = ({ data }) => {
        fuzzOn = data.isOn;
        updatePianoRouting();
        fuzzToggle.style.opacity = data.isOn ? "1" : "0.5";
      };

      const fuzzAmount = document.getElementById("fuzz-amount");
      fuzzAmount.defaultData = { val: 0.8 };
      fuzzAmount.onMount = ({ setData }) => {
        fuzzAmount.addEventListener("input", (e) => setData({ val: parseFloat(e.target.value) }));
      };
      fuzzAmount.updateElement = ({ data }) => {
        fuzzAmount.value = data.val;
        fuzz.distortion = data.val;
      };

      const echoToggle = document.getElementById("echo-toggle");
      echoToggle.defaultData = { isOn: false };
      echoToggle.onClick = (e, { data, setData }) => setData({ isOn: !data.isOn });
      echoToggle.updateElement = ({ data }) => {
        echoOn = data.isOn;
        updatePianoRouting();
        echoToggle.style.opacity = data.isOn ? "1" : "0.5";
      };

      const echoTime = document.getElementById("echo-time");
      echoTime.defaultData = { val: 0.5 };
      echoTime.onMount = ({ setData }) => {
        echoTime.addEventListener("input", (e) => setData({ val: parseFloat(e.target.value) }));
      };
      echoTime.updateElement = ({ data }) => {
        echoTime.value = data.val;
        delay.delayTime.value = data.val;
      };

      const echoFeedback = document.getElementById("echo-feedback");
      echoFeedback.defaultData = { val: 0.5 };
      echoFeedback.onMount = ({ setData }) => {
        echoFeedback.addEventListener("input", (e) => setData({ val: parseFloat(e.target.value) }));
      };
      echoFeedback.updateElement = ({ data }) => {
        echoFeedback.value = data.val;
        delay.feedback.value = data.val;
      };

      const tunerToggle = document.getElementById("tuner-toggle");
      tunerToggle.defaultData = { isOn: false };
      tunerToggle.onClick = (e, { data, setData }) => setData({ isOn: !data.isOn })
      tunerToggle.updateElement = ({ data }) => {
        if (data.isOn) { noise.start(); } else { noise.stop(); }
        
        const btnImg = tunerToggle.querySelector("img");
        if (btnImg) {
          btnImg.src = data.isOn ? "images/on_toggle.png" : "images/off_toggle.png";
          btnImg.alt = data.isOn ? "ON" : "OFF";
        }
      };

      const tunerFreq = document.getElementById("tuner-freq");
      tunerFreq.defaultData = { val: 400 };
      tunerFreq.onMount = ({ setData }) => {
        tunerFreq.addEventListener("input", (e) => setData({ val: parseFloat(e.target.value) }));
      };
      tunerFreq.updateElement = ({ data }) => {
        tunerFreq.value = data.val;
        noiseFilter.frequency.rampTo(data.val, 0.1);
      };

      // --- SEQUENCER ---
      const seqSynths = [
        new Tone.Synth({ oscillator: { type: "triangle" } }).connect(masterFilter),
        new Tone.PolySynth().connect(masterFilter),                                 
        new Tone.MembraneSynth().connect(masterFilter)                              
      ];
      const seqNotes = ["C5", ["E3", "G3", "B3"], "C1"];
      let rowPlaying = [false, false, false];
      let currentStep = 0;

      Tone.Transport.scheduleRepeat((time) => {
        for(let r = 0; r < 3; r++) {
          if(rowPlaying[r]) {
            const stepInput = document.getElementById(`step-${r}-${currentStep}`);
            if(stepInput && stepInput.checked) seqSynths[r].triggerAttackRelease(seqNotes[r], "16n", time);
          }
        }
        Tone.Draw.schedule(() => {
          document.querySelectorAll('.led-step').forEach(s => s.classList.remove('active-step'));
          for(let r = 0; r < 3; r++) {
            const stepInput = document.getElementById(`step-${r}-${currentStep}`);
            if(stepInput) stepInput.classList.add('active-step');
          }
        }, time);
        currentStep = (currentStep + 1) % 8;
      }, "8n");

      for(let r = 0; r < 3; r++) {
        const btn = document.getElementById(`play-btn-${r}`);
        btn.defaultData = { isPlaying: false };
        btn.onClick = (e, { data, setData }) => setData({ isPlaying: !data.isPlaying });
        btn.updateElement = ({ data }) => {
          rowPlaying[r] = data.isPlaying;
          btn.classList.toggle('active-play', data.isPlaying);
          
          if (!rowPlaying.some(row => row)) {
            currentStep = 0;
            document.querySelectorAll('.led-step').forEach(s => s.classList.remove('active-step'));
          }
        };

        for(let c = 0; c < 8; c++) {
          const stepInput = document.getElementById(`step-${r}-${c}`);
          stepInput.defaultData = { isChecked: false };
          stepInput.onMount = ({ setData }) => {
            stepInput.addEventListener("change", (e) => setData({ isChecked: e.target.checked }));
          };
          stepInput.updateElement = ({ data }) => {
            stepInput.checked = data.isChecked;
          };
        }
      }

      // --- XY PAD ---
      const xyFilter = new Tone.Filter(400, "lowpass").connect(masterFilter);
      const xySynth = new Tone.Synth({ oscillator: { type: "sawtooth" } }).connect(xyFilter);
      let xyActiveLocal = false;
      let lastXyX = 0.5;
      let lastXyY = 0.5;

      const pad = document.getElementById('xy-pad');
      const cursor = document.getElementById('xy-cursor');
      
      pad.defaultData = { pctX: 0.5, pctY: 0.5, active: false };
      pad.onMount = ({ setData }) => {
        let isDragging = false;
        pad.style.touchAction = "none";
        
        const emitCoords = (e) => {
          const rect = pad.getBoundingClientRect();
          lastXyX = Math.max(0, Math.min(e.clientX - rect.left, rect.width)) / rect.width;
          lastXyY = Math.max(0, Math.min(e.clientY - rect.top, rect.height)) / rect.height;
          setData({ pctX: lastXyX, pctY: lastXyY, active: true });
        };

        pad.addEventListener('pointerdown', (e) => { 
          isDragging = true; 
          pad.setPointerCapture(e.pointerId);
          emitCoords(e); 
        });
        pad.addEventListener('pointerup', (e) => { 
          if(isDragging) { 
            isDragging = false; 
            pad.releasePointerCapture(e.pointerId);
            setData({ pctX: lastXyX, pctY: lastXyY, active: false }); 
          } 
        });
        pad.addEventListener('pointermove', (e) => { 
          if(isDragging) emitCoords(e); 
        });
      };

      pad.updateElement = ({ data }) => {
        cursor.style.left = `${data.pctX * 100}%`;
        cursor.style.top = `${data.pctY * 100}%`;

        if (data.active && !xyActiveLocal) {
          xySynth.triggerAttack("C3");
          xyActiveLocal = true;
        } else if (!data.active && xyActiveLocal) {
          xySynth.triggerRelease();
          xyActiveLocal = false;
        }

        xySynth.frequency.rampTo(Math.max(60, data.pctX * 500), 0.1);
        xyFilter.frequency.rampTo(Math.max(100, (1 - data.pctY) * 2000), 0.1);
      };

      // --- RIBBON GLIDER ---
      const ribbonSynth = new Tone.Synth({ oscillator: { type: "sine" } }).connect(masterFilter);
      const ribbon = document.getElementById('ribbon-track');
      const finger = document.getElementById('ribbon-finger');
      let ribbonActiveLocal = false;
      let lastRibbonX = 0.5;

      ribbon.defaultData = { pctX: 0.5, active: false };
      ribbon.onMount = ({ setData }) => {
        let isGliding = false;
        ribbon.style.touchAction = "none";
        
        const emitX = (e) => {
          const rect = ribbon.getBoundingClientRect();
          lastRibbonX = Math.max(0, Math.min(e.clientX - rect.left, rect.width)) / rect.width;
          setData({ pctX: lastRibbonX, active: true });
        };

        ribbon.addEventListener('pointerdown', (e) => { 
          isGliding = true; 
          ribbon.setPointerCapture(e.pointerId);
          emitX(e); 
        });
        ribbon.addEventListener('pointerup', (e) => { 
          if(isGliding) { 
            isGliding = false; 
            ribbon.releasePointerCapture(e.pointerId);
            setData({ pctX: lastRibbonX, active: false }); 
          } 
        });
        ribbon.addEventListener('pointermove', (e) => { 
          if(isGliding) emitX(e); 
        });
      };

      ribbon.updateElement = ({ data }) => {
        finger.style.left = `${data.pctX * 100}%`;

        if (data.active && !ribbonActiveLocal) {
          ribbonSynth.triggerAttack(ribbonSynth.frequency.value);
          ribbonActiveLocal = true;
        } else if (!data.active && ribbonActiveLocal) {
          ribbonSynth.triggerRelease();
          ribbonActiveLocal = false;
        }

        const freq = Math.max(100, data.pctX * 1500);
        ribbonSynth.frequency.rampTo(freq, 0.05); 
      };

      // ==========================================
      // 4. INITIALIZE PLAYHTML
      // ==========================================
      playhtml.init({
        cursors: { enabled: true, room: "pedalboard-v3" }
      });
      window.playhtml = playhtml;

    </script>
  </body>
</html>
